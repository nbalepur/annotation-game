<div class="card bg-faded h-100">
  <div class="card-header bg-primary bg-opacity-50" data-bs-toggle="" id="instruction-header" data-bs-target="#instruction-collapse" aria-expanded="false" aria-controls="instruction-collapse">
    
    {% if is_pairwise %}
      <h5 style="font-size: large;">Plan (p)</h5>
    {% else %}
      <h5 style="font-size: large;">Plan A (p)</h5>
    {% endif %}
  </div>

  <iframe id="instruction-frame" srcdoc='
  <!DOCTYPE html>
  <html lang=&quot;en&quot;>

  <head>
  <meta charset=&quot;UTF-8&quot;>
  <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
  <title>Embedded Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  </head>

    <body>

      <div class="row align-items-center g-2" id="follow-plan-div" style="visibility: hidden; margin: 10px; margin-top: 5px;">
        <!-- Left Section -->
        <div class="col-12 col-sm-4 d-flex align-items-center m-0 p-0 mt-1">
          <div class="form-check form-switch" id="swap-button-in-plan">
            <input class="form-check-input" style="transform: scale(1.5); transform-origin: top left;" type="checkbox" role="switch" id="swap-button-in-plan-btn" onchange="window.parent.swap_plan()">
            <label class="form-check-label ms-3 mt-1" for="swap-button-in-plan-btn">Swap Plan (s)</label>
          </div>
          
          <div>
      
          <button class="btn btn-secondary opacity-75 btn-sm" 
            style="display: none;" 
            id="skip-button-in-plan" 
            onclick="window.parent.skip_plan()">Skip (no credit)</button>
          </div>
        </div>
      
        <!-- Right Section -->
        <div class="col-12 col-sm-8">
          <div class="form-check text-sm-end text-start" id="edit-instructions-container">
            <input class="form-check-input" type="checkbox" value="" id="edit-instructions-checkbox">
            <label class="form-check-label" for="edit-instructions-checkbox" id="edit-instructions-checkbox-label">
              I can&apos;t answer the question with the given plan
            </label>
          </div>
        </div>
      </div>
      
      

      <div style="display: none;" id="rogue-notes">
        <div class="form-group m-2">
          <textarea id="rogue-notes-area" class="form-control" placeholder="Enter your own plan here..." rows=10></textarea>
        </div>
        <div id="rogue-notes-status" style="visibility: hidden;" class="ms-2 me-2">
        </div>
        <div class="form-group m-2 d-flex align-items-center" id="rogue-answer">
          <textarea id="rogue-answer-input" 
            class="form-control input-sm flex-grow-1" 
            style="resize: none; border-radius: 0.5rem 0 0 0.5rem;"
            rows=1
            placeholder="Enter your answer here..."></textarea>
          <button class="btn btn-primary btn-sm" 
            style="display: none; white-space: nowrap; height: 38px; border-radius: 0 0.5rem 0.5rem 0;" 
            id="buzz-button-in-plan" 
            onclick="window.parent.buzz()">Answer (Enter)
          </button>
        </div>  
        <div id="rogue-answer-status" style="visibility: hidden;" class="ms-2 me-2">
        </div>            
      </div>

      <div id="instructions-container" style="margin: 10px;">
      </div>

      <style>  
        .flash-highlight {
          background-color: #fffca1 !important;
        }
      </style>

      <script>
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            const activeElement = document.activeElement;
            if (activeElement.tagName === "INPUT" || activeElement.tagName === "TEXTAREA") {
              activeElement.blur();
            }
          } else {
            if (window.parent && typeof window.parent.handleKeyDown === "function") {
              window.parent.handleKeyDown(event);
            }
          }
        });

        document.getElementById("edit-instructions-checkbox").addEventListener("click", function() {
          const isPairwise = {{ is_pairwise|yesno:"true,false" }};
          window.parent.toggleRogueCheckbox(this, isPairwise);
        });
      
        document.addEventListener("keypress", function (event) {
            if (window.parent && typeof window.parent.handleKeyPress === "function") {
              window.parent.handleKeyPress(event);
            }
        });
      </script>
      
    </body>
  </html>
  '>
  </iframe>

</div>

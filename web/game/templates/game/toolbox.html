<div class="flex-container">
  <!-- Calculator Tool -->
  <div id="toolbox-container" class="flex-grow-1 d-flex flex-column">

  <div class="input-group mb-2" id="calculator-tool" style="display: {% if show_web_first %}none{% else %}{% endif %};">
    <button type="button" class="btn btn-primary" disabled id="calc-expression-btn" onclick="calculate()">
      <i class="fas fa-calculator"></i>
    </button>
    <input type="text" id="calc-expression" class="form-control" disabled placeholder="Enter a math equation (m)" />
    <button type="button" class="btn btn-primary" disabled id="calc-expression-btn2" onclick="calculate()">
      Calculate
    </button>
    <button type="button" class="btn btn-secondary" disabled id="calc-clear-btn" onclick="clear_math()">
      <i class="fa-solid fa-delete-left"></i>
    </button>
  </div>
  
  <div id="calculator-operators" class="btn-group mb-3" role="group" style="display: {% if show_web_first %}none{% else %}{% endif %};">
    <button type="button" style="background-color: #e8e6e6; border: 1px solid black; color: black;" class="btn btn-op" disabled onclick="insertOperator('+')">+</button>
    <button type="button" style="background-color: #e8e6e6; border: 1px solid black;" class="btn btn-op" disabled onclick="insertOperator('-')">-</button>
    <button type="button" style="background-color: #e8e6e6; border: 1px solid black;" class="btn btn-op" disabled onclick="insertOperator('*')">×</button>
    <button type="button" style="background-color: #e8e6e6; border: 1px solid black;" class="btn btn-op" disabled onclick="insertOperator('/')">÷</button>
    <button type="button" style="background-color: #e8e6e6; border: 1px solid black;" class="btn btn-op" disabled onclick="insertOperator('(')">(</button>
    <button type="button" style="background-color: #e8e6e6; border: 1px solid black;" class="btn btn-op" disabled onclick="insertOperator(')')">)</button>
    <button type="button" style="background-color: #4A90E2; border: 1px solid black;" disabled class="btn btn-primary" id="calculate-btn-equals" onclick="calculate()">=</button>
  </div>


  <div class="input-group mb-3" id="calculator-tool-result" style="display: {% if show_web_first %}none{% else %}{% endif %};">
    <button type="button" class="btn btn-secondary" disabled id="calc-copy-btn" onclick="copyMathResult()">
      Copy To Plan (c):
    </button>
    <input type="text" id="calc-result" class="form-control" disabled placeholder="Results will come here!" readonly>
  </div>


  <!-- Google Tool -->
  <div id="google-tool" class="mb-3" style="display: {% if show_web_first %}{% else %}none{% endif %};">
    <div class="input-group">
      <button type="button" id="google-query-btn" class="btn btn-primary" disabled onclick="webSearch()">
        <i class="fas fa-globe"></i>
      </button>
      <input type="text" id="google-query" class="form-control" disabled placeholder="Enter a web search query (w)" />
      <button type="button" class="btn btn-primary" id="google-query-btn2" disabled onclick="webSearch()">
        Web Search
      </button>
      <button type="button" class="btn btn-secondary" disabled id="search-clear-btn" onclick="clear_search()">
        <i class="fa-solid fa-delete-left"></i>
      </button>
    </div>
  </div>
  

<!-- Document Viewer -->
<div id="doc-viewer" style="display: {% if show_web_first %}{% else %}none{% endif %};">
  <div class="card flex-grow-1 d-flex flex-column">
    <div class="card-header view-page-header" id="view-page-header">
      <h6>Web Page Viewer</h6>
    </div>

    <div id="doc-viewer-content" class="d-flex flex-column flex-grow-1 p-2">
      <!-- Content Selector Tool -->
      <div class="row align-items-center g-3" id="content-selector-tool" style="display: none;">
        <!-- Navigation Buttons -->
        <div class="col-sm-12 col-xl-5 d-flex justify-content-start">

          <div class="btn-group" role="group" aria-label="Navigation">
            <button type="button" class="btn btn-primary me-2" 
                    style="color: #4A90E2; border-color: #4A90E2; background-color: transparent; transition: background-color 0.3s ease;" 
                    disabled id="content-bwd-btn" onclick="navigateHistory(-1)">
              <i class="fas fa-arrow-left"></i>
            </button>
            <button type="button" class="btn btn-primary btn-outline me-3" 
                    style="color: #4A90E2; border-color: #4A90E2; background-color: transparent; transition: background-color 0.3s ease; border-radius: 0rem 0.5rem 0.5rem 0rem;" 
                    disabled id="content-fwd-btn" onclick="navigateHistory(1)">
              <i class="fas fa-arrow-right"></i>
            </button>

            <button type="button" class="btn btn-secondary" id="copy-search-btn" style="border-radius: 0.5rem 0.5rem 0.5rem 0.5rem;"  
            style="visibility: hidden;" disabled onclick="copyDocText()">
              Copy to Plan
            </button>
          </div>

        </div>

        <!-- Search Input Group -->
        <div class="col-sm-12 col-xl-7 d-flex align-items-center">
          <button type="button" class="btn btn-primary" id="content-search-btn" 
                  disabled style="border-radius: 0.5rem 0 0 0.5rem; background-color: #4A90E2; border-color: #4A90E2; color: #FFFFFF;" 
                  onclick="selectContent()">
            <i style="color: white;" class="fas fa-search"></i>
          </button>
          <input type="text" id="content-search" class="form-control" style="border-radius: 0rem 0 0 0rem;"
                 disabled placeholder="Enter a page find query (f)" />
          <button type="button" class="btn btn-primary" id="content-search-btn2" style="border-radius: 0rem 0 0 0rem; background-color: #4A90E2; border-color: #4A90E2; color: #FFFFFF;"
                  disabled
                  onclick="selectContent()">
            Find
          </button>
          <button type="button" class="btn btn-secondary" style="border-radius: 0rem 0.5rem 0.5rem 0rem;" 
                  disabled id="find-clear-btn" onclick="clear_find()">
            <i class="fa-solid fa-delete-left"></i>
          </button>
        </div>
        

      </div>

      <!-- Divider -->
      <hr class="my-3" />

      <!-- Document Viewer Iframe -->
      <iframe class="mb-2 flex-grow-1 w-100" id="view-page-collapse" sandbox="allow-scripts allow-same-origin" srcdoc='
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>Embedded Page</title>
          <!-- Bootstrap CSS -->
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        </head>
        <body>
          <div style="margin-left:10px; margin-right:10px;">
            <p>Search to make a document appear!</p>
          </div>
        </body>
        <script>
          document.addEventListener("keypress", function (event) {
            if (window.parent && typeof window.parent.handleKeyPress === "function") {
              window.parent.handleKeyPress(event);
            }
          });
          document.addEventListener("keydown", function (event) {
            if (window.parent && typeof window.parent.handleKeyDown === "function") {
              window.parent.handleKeyDown(event);
            }
          });
        </script>
        </html>'></iframe>
    </div>
  </div>
</div>

      <div class="card-header bg-info">
        <h6>Tool History</h6>
      </div>

      <iframe id="tool-history-frame" srcdoc='

      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
      
      <body>
      <div style="margin: 10px;" id="tool-entry-container">
    </div>
  </body>
      '
      >
    </iframe>
    </div> -->

  </div>
</div>

<!-- CSS -->
<style>
  /* Custom Styling */
  .flex-container {
    display: flex;
    flex-direction: column;
    height: 100%; /* Full height of parent container */
  }

  /* Allow #doc-viewer to take up the remaining space */
  #doc-viewer {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  #doc-viewer-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    padding-left: 10px;
    padding-right: 10px;
  }

  /* Ensure iframe takes up all available space in #doc-viewer-content */
  iframe {
    flex-grow: 1;
    width: 100%;
    border: none;
  }

</style>

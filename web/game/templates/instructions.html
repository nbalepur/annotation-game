{% extends "game/base.html" %}
{% load static %}

{% block content %}
<div class="container">
  <br />
  <div class="row justify-content-center">
    <div class="col-lg-12">
      {% if setting_type == "pairwise" %}
        {% include "instructions/pairwise_phase.html" %}
      {% elif setting_type == "swap" %}
        {% include "instructions/swap_phase.html" %}
      {% endif %}
    </div>
  </div>
  <div class="row justify-content-center">
    <button id="get-started-btn" class="btn btn-info btn m-4" onclick="joinNewRoom()">Let's Get Started!</button>
  </div>
</div>
<script src="{% static 'game/home.js' %}"></script>
{% endblock %}
